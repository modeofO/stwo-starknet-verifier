[package]
license = "Apache-2.0"
name = "lane2_probe"
version = "0.1.0"
edition = "2024_07"

[[target.executable]]

[cairo]
enable-gas = false

[features]
poseidon252_verifier = [
    "stwo_cairo_air/poseidon252_verifier",
    "stwo_verifier_core/poseidon252_verifier",
]
qm31_opcode = ["stwo_cairo_air/qm31_opcode", "stwo_verifier_core/qm31_opcode"]
blake_outputs_packing = ["stwo_cairo_air/blake_outputs_packing"]
poseidon_outputs_packing = ["stwo_cairo_air/poseidon_outputs_packing"]

[dependencies]
stwo_cairo_air = { path = "../../vendor/stwo_cairo_verifier/crates/cairo_air" }
stwo_verifier_core = { path = "../../vendor/stwo_cairo_verifier/crates/verifier_core" }
stwo_constraint_framework = { path = "../../vendor/stwo_cairo_verifier/crates/constraint_framework" }
stwo_verifier_utils = { path = "../../vendor/stwo_cairo_verifier/crates/verifier_utils" }
cairo_execute = "2.18.0"
