[workspace]
resolver = "2"
members = ["core", "cli", "gui", "daemon", "gateway"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
ureq = { version = "2", features = ["json"] }
starknet-crypto = "0.8"
starknet-types-core = { version = "0.2", features = ["curve"] }
starknet-curve = "0.6"
hkdf = "0.12"
sha2 = "0.10"
aes-gcm = "0.10"
rand = "0.8"
hex = "0.4"
sha3 = "0.10"
clap = { version = "4", features = ["derive"] }
# Blocking, threaded HTTP/1.1 server for the companion daemon. Chosen over
# any async runtime because the send pipeline blocks on subprocess proving —
# a thread-per-request model matches it (companion-protocol.md, "Server").
tiny_http = "0.12"
