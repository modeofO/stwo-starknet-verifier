[workspace]

[package]
name = "zkmsg"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "zkmsg"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
ureq = { version = "2", features = ["json"] }
starknet-crypto = "0.8"
starknet-types-core = { version = "0.2", features = ["curve"] }
starknet-curve = "0.6"
hkdf = "0.12"
sha2 = "0.10"
aes-gcm = "0.10"
rand = "0.8"
hex = "0.4"
sha3 = "0.10"
