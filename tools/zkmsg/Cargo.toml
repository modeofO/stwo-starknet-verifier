[workspace]
resolver = "2"
members = ["core", "cli", "gui", "gateway"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
ureq = { version = "2", features = ["json", "gzip"] }
starknet-crypto = "0.8"
starknet-types-core = { version = "0.2", features = ["curve"] }
starknet-curve = "0.6"
hkdf = "0.12"
sha2 = "0.10"
aes-gcm = "0.10"
rand = "0.8"
hex = "0.4"
sha3 = "0.10"
# ML-KEM-768 (FIPS 203) for the v2 hybrid KEM. `hazmat` exposes
# deterministic encapsulation, which the golden vectors pin.
ml-kem = { version = "0.3.2", features = ["hazmat"] }
clap = { version = "4", features = ["derive"] }

# Argon2id runs at 256 MiB for the app PIN: unoptimized it takes ~20x longer.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
