[package]
license = "Apache-2.0"
name = "zkmsg-gui"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "zkmsg-gui"
path = "src/main.rs"

[dependencies]
zkmsg-core = { path = "../core" }
# The pairing panel reuses the daemon's URI builder and its 0600 pair-file
# writer, so the desktop and the phone agree on one exact wire format.
zkmsg-daemon = { path = "../daemon" }
eframe = "0.29"
anyhow.workspace = true
starknet-types-core.workspace = true
