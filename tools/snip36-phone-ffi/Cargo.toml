[package]
name = "snip36_phone_ffi"
version = "0.1.0"
edition = "2021"
publish = false
description = "Spike: C ABI over the SNIP-36 virtual-OS transaction prover, for on-device proving."

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
blockifier_reexecution.workspace = true
libc = "0.2"
serde_json.workspace = true
starknet_api.workspace = true
starknet_transaction_prover = { workspace = true, features = ["stwo_proving"] }
tokio = { workspace = true, features = ["rt-multi-thread"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
