[package]
name = "stwo_circuit_verifier_contract"
version = "0.1.0"
edition = "2024_07"

[dependencies]
starknet = "2.18.0"
stwo_circuit_air = { path = "../../vendor/stwo_cairo_verifier/crates/circuit_air" }

# NOTE: the circuit verifier only supports the blake2s hasher — under
# `poseidon252_verifier` its `get_verification_output` unconditionally panics
# (see circuit_air/src/lib.cairo), so no hash feature is enabled here.
[features]
poseidon252_verifier = ["stwo_circuit_air/poseidon252_verifier"]

[[target.starknet-contract]]
sierra = true
# Deployability probe: enforce the allowlist used for declared classes.
allowed-libfuncs-list.name = "audited"

