[package]
license = "Apache-2.0"
name = "stwo_fact_registry"
version = "0.1.0"
edition = "2024_07"

[dependencies]
starknet = "2.18.0"
stwo_verifier_phases = { path = "../stwo_verifier_phases" }

# NOTE: blake2s configuration (default) — the circuit verifier only
# supports the blake2s hasher, and blake2s libfuncs are in the audited set.

[features]
# See stwo_verifier_phases: qm31-native build for sepolia-integration.
qm31_opcode = ["stwo_verifier_phases/qm31_opcode"]

[[target.starknet-contract]]
sierra = true
# Deployability probe: enforce the allowlist used for declared classes.
allowed-libfuncs-list.name = "audited"
# Make the phase library classes declarable from this package's tests.
build-external-contracts = ["stwo_verifier_phases::StwoPhase1", "stwo_verifier_phases::StwoPhase2"]

[dev-dependencies]
snforge_std = "0.61.0"
assert_macros = "2.18.0"

[scripts]
test = "snforge test"

[tool.scarb]
allow-prebuilt-plugins = ["snforge_std"]

[tool.snforge]
# The verify path is ~4M steps of real STARK verification plus unpacking;
# the default step limit is too small for the end-to-end test.
max_n_steps = 100000000
